# Source of truth for LogiDuo.xcodeproj. Regenerate with `make project`;
# CI fails if the committed project is out of date.
name: LogiDuo
options:
  bundleIdPrefix: io.github.bafsheh
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  LogiDuoKit:
    path: Packages/LogiDuoKit

targets:
  LogiDuo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: LogiDuoKit
        product: LogiDuoDomain
      - package: LogiDuoKit
        product: LogiDuoFeatures
      - package: LogiDuoKit
        product: LogiDuoSystem
      - package: LogiDuoKit
        product: LogiDuoHIDPP
      - package: LogiDuoKit
        product: LogiDuoHID
      - package: LogiDuoKit
        product: LogiDuoPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bafsheh.LogiDuo
        PRODUCT_NAME: LogiDuo
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/LogiDuo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: LogiDuo
        CFBundleName: LogiDuo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 LogiDuo contributors. Not affiliated with Logitech."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/Resources/LogiDuo.entitlements
      properties: {}

  LogiDuoAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: LogiDuo
      - package: LogiDuoKit
        product: LogiDuoDomain
      - package: LogiDuoKit
        product: LogiDuoSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bafsheh.LogiDuo.AppTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LogiDuo.app/Contents/MacOS/LogiDuo"

  LogiDuoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: LogiDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bafsheh.LogiDuo.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LogiDuo

schemes:
  LogiDuo:
    build:
      targets:
        LogiDuo: all
        LogiDuoAppTests: [test]
        LogiDuoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LogiDuo
      targets:
        - LogiDuoAppTests
        - LogiDuoUITests
    archive:
      config: Release
